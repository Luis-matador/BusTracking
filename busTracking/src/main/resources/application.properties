spring.application.name=busTracking

# Conexión con MySQL. Las credenciales se leen de variables de entorno (ver README).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bus_tracking}
spring.datasource.username=${DB_USERNAME:bus_admin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Evita errores al serializar proxies de Hibernate
spring.jackson.serialization.fail-on-empty-beans=false

# Código para registrarse como administrador. Si está vacío, nadie puede registrarse como admin.
app.admin.codigo=${ADMIN_CODIGO:}

logging.level.com.busTracking=INFO
